# Builds the site with a fresh data.json and deploys it to GitHub Pages.
# Runs hourly so visitors read one prebuilt file instead of each calling Open-Meteo
# (whose free tier allows ~600 weighted calls per minute per IP — about one full download).
name: Deploy site with fresh forecast data

on:
  push:
    branches: [main]
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.fetch.outcome == 'success' || github.event_name != 'schedule' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Fetch forecast data
        id: fetch
        continue-on-error: true
        timeout-minutes: 20
        run: node scripts/build-data.mjs _data.json
      # A scheduled run without fresh data skips deploying, so the previous data.json stays live.
      # A code push always deploys; without data.json the page falls back to calling Open-Meteo itself.
      - name: Assemble site
        if: steps.fetch.outcome == 'success' || github.event_name != 'schedule'
        run: |
          mkdir _site
          cp index.html tests.html app.css *.js .nojekyll _site/
          if [ -f _data.json ]; then mv _data.json _site/data.json; fi
      - uses: actions/upload-pages-artifact@v4
        if: steps.fetch.outcome == 'success' || github.event_name != 'schedule'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
