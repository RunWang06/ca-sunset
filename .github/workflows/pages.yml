# Builds the site with a fresh data.json and deploys it to GitHub Pages.
# Runs hourly so visitors read one prebuilt file instead of each calling Open-Meteo
# (whose free tier allows ~600 weighted calls per minute per IP — about one full download).
name: Deploy site with fresh forecast data

on:
  push:
    branches: [main]
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch forecast data
        run: node scripts/build-data.mjs _data.json
      - name: Assemble site
        run: |
          mkdir _site
          cp index.html tests.html app.css *.js .nojekyll _site/
          mv _data.json _site/data.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
