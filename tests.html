<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model Tests</title>
<style>
  :root { --bg: #fff; --ink: #222; --ok: #1f8a5b; --bad: #c2412c; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #15111a; --ink: #eee; --ok: #4cc38a; --bad: #ff7b66; } }
  :root[data-theme="dark"] { --bg: #15111a; --ink: #eee; --ok: #4cc38a; --bad: #ff7b66; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.5 ui-monospace, Menlo, monospace; padding: 16px; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
</style>
</head>
<body>
<h1>Model &amp; translation tests / 模型与翻译测试</h1>
<pre id="out"></pre>
<script type="module">
import { canvasQuality, marineHeuristic, clarityFactor, inSector, memberScore, forecast, marineLayerTop, MODELS } from './model.js';
import { detectBrokenModels, buildInputs } from './data.js';
import { sunsetInfo } from './sun.js';
import { REGION_BY_ID, REGIONS } from './spots.js';
import { STRINGS, setLang, tr } from './i18n.js';

const out = []; let fails = 0;
const ok = (cond, name, extra = '') => { out.push(`<span class="${cond ? 'ok' : 'bad'}">${cond ? '✓' : '✗'} ${name}</span> ${extra}`); if (!cond) fails++; };

const cell = (low, mid, high) => ({ low, mid, high });
const obs = (low, mid, high, o = {}) => ({ low, mid, high, vis: 30000, t2: 18, t925: 16, rh: 60, precip: 0, ...o });
const member = (o, path, id = 'ecmwf_ifs025', w = 0.2) => ({ id, name: id, w, path: [o, ...path] });
const clearPath = [cell(0, 0.3, 0.4), cell(0, 0.2, 0.4), cell(0, 0, 0.1), cell(0, 0, 0)];
const ctx0 = { clarity: 1, horizon: 1, aboveFog: false };

// canvas curve
ok(Math.abs(canvasQuality(0) - 0.22) < 1e-9, 'clear sky canvas = 0.22');
ok(canvasQuality(0.55) === 1, 'canvas peak at ~55%');
ok(canvasQuality(1) < canvasQuality(0.6) && canvasQuality(1) >= 0.5, 'overcast canvas penalised but not zero');

// scores
const ideal = memberScore(member(obs(0, 0.25, 0.45), clearPath), ctx0);
ok(ideal.score >= 85, 'ideal evening scores ≥ 85', ideal.score.toFixed(1));
const clear = memberScore(member(obs(0, 0, 0), [cell(0, 0, 0), cell(0, 0, 0), cell(0, 0, 0), cell(0, 0, 0)]), ctx0);
ok(clear.score > 18 && clear.score < 26, 'cloudless evening ≈ 22', clear.score.toFixed(1));

let prev = 101, mono = true;
for (const low of [0, 0.2, 0.4, 0.6, 0.8, 1]) {
  const p = [cell(0, 0.3, 0.4), cell(low, 0.2, 0.4), cell(low, 0, 0.1), cell(low, 0, 0)];
  const s = memberScore(member(obs(0, 0.25, 0.45), p), ctx0).score;
  if (s > prev + 1e-9) mono = false; prev = s;
}
ok(mono, 'more far-ocean low cloud never raises the score (light path)');

prev = 101; mono = true;
for (const low of [0, 0.2, 0.4, 0.6, 0.8, 1]) {
  const s = memberScore(member(obs(low, 0.25, 0.45), clearPath), ctx0).score;
  if (s > prev + 1e-9) mono = false; prev = s;
}
ok(mono, 'more local low cloud never raises the score');
ok(memberScore(member(obs(1, 0.25, 0.45, { vis: 400 }), clearPath), ctx0).score < 10, 'dense fog at the spot → near zero');

// marine-layer heuristic
ok(marineHeuristic(15, 28, 96) > 0.8, 'strong inversion + saturated air → marine layer likely', marineHeuristic(15, 28, 96).toFixed(2));
ok(marineHeuristic(22, 20, 50) < 0.05, 'no inversion, dry → unlikely');
ok(marineHeuristic(null, 20, 50) === null, 'missing input → null (not a fake value)');
const hidden = memberScore(member(obs(0, 0.25, 0.45, { t2: 15, t925: 28, rh: 97 }), clearPath), ctx0);
ok(hidden.effLow > 0.6 && hidden.score < ideal.score * 0.65, 'global model with 0 % low cloud but marine signature is penalised', `effLow ${hidden.effLow.toFixed(2)}`);

// clarity
ok(clarityFactor(0.05) === 1 && clarityFactor(0.3) < 1 && clarityFactor(0.8) < clarityFactor(0.4), 'AOD monotonic');
ok(clarityFactor(null) === 0.88, 'missing AOD → conservative 0.88');

// sectors
ok(inSector(250, [200, 320]) && !inSector(330, [200, 320]) && inSector(10, [300, 30]), 'horizon sector incl. wrap-around');

// marine-layer top
ok(marineLayerTop({ cc1000: 0.9, cc975: 0.8, cc950: 0.1, cc925: 0, cc900: 0 }) === 440, 'ML top from pressure levels', marineLayerTop({ cc1000: 0.9, cc975: 0.8, cc950: 0.1 }));

// full forecast
const region = REGION_BY_ID.bay;
const sun = sunsetInfo('2026-10-07', 37.76, -122.511, 5);
const spot = { id: 't', lat: 37.76, lon: -122.511, elev: 5, view: [200, 320] };
const mk = (o, p) => MODELS.map((M) => member(o, p, M.id, M.w[0]));
const good = forecast({ spot, sun, day: 0, members: mk(obs(0, 0.25, 0.45), clearPath), aq: { aod: 0.06 }, profile: null, region, month: 9, pathAvailable: true });
ok(good.score >= 85 && good.prob > 0.7 && good.confidence.level === 'high', 'agreeing ideal members → high score, high prob, high confidence', `${good.score} / ${(good.prob * 100) | 0}%`);
const split = forecast({ spot, sun, day: 0, members: [...mk(obs(0, 0.25, 0.45), clearPath).slice(0, 2), ...mk(obs(1, 0, 0), clearPath).slice(2)], aq: { aod: 0.06 }, profile: null, region, month: 9, pathAvailable: true });
ok(split.prob < good.prob && split.confidence.level !== 'high', 'disagreeing members → lower prob & confidence', `${split.score} / ${(split.prob * 100) | 0}% / ${split.confidence.level}`);
const tomorrow = forecast({ spot, sun, day: 1, members: mk(obs(0, 0.25, 0.45), clearPath), aq: { aod: 0.06 }, profile: null, region, month: 9, pathAvailable: true });
ok(tomorrow.prob < good.prob, 'same forecast tomorrow → lower probability (lead time)');
const none = forecast({ spot, sun, day: 0, members: mk(null, []), aq: null, profile: null, region, month: 9, pathAvailable: false });
ok(none.insufficient && none.score === null && none.prob === null, 'no data → insufficient, no fake numbers');
ok(good.score !== null && forecast({ spot, sun, day: 0, members: mk(obs(0, 0.25, 0.45), clearPath), aq: null, profile: null, region, month: 9, pathAvailable: true }).warnings.some((w) => w.id === 'warn.aod'), 'missing AOD is surfaced as a warning');

// above the fog
const foggyPath = [cell(0.95, 0.2, 0.4), cell(0.2, 0.1, 0.3), cell(0, 0, 0.1), cell(0, 0, 0)];
const fogProfile = { low: 0.95, cc1000: 0.95, cc975: 0.9, cc950: 0.2, cc925: 0, cc900: 0, blh: 300 };
const hill = { ...spot, elev: 760 };
const low = forecast({ spot, sun, day: 0, members: mk(obs(0.95, 0.2, 0.4), foggyPath), aq: { aod: 0.06 }, profile: fogProfile, region, month: 9, pathAvailable: true });
const high = forecast({ spot: hill, sun, day: 0, members: mk(obs(0.1, 0.2, 0.4), foggyPath), aq: { aod: 0.06 }, profile: fogProfile, region, month: 9, pathAvailable: true });
ok(!low.aboveFog && low.score < 25, 'beach in fog scores low', low.score);
ok(high.aboveFog && high.score > low.score + 30, 'peak above the marine layer is flagged and scores higher', `${high.score}, top ${high.mlTop} m`);
const noFogHill = forecast({ spot: hill, sun, day: 0, members: mk(obs(0, 0, 0), [cell(0, 0, 0), cell(0, 0, 0), cell(0, 0, 0), cell(0, 0, 0)]), aq: { aod: 0.06 }, profile: { low: 0, blh: 200 }, region, month: 9, pathAvailable: true });
ok(!noFogHill.aboveFog, 'no fog anywhere → no "above the fog" claim');

// sun
const sf = new Date(sun.sunset).toLocaleTimeString('en-US', { timeZone: 'America/Los_Angeles', hour: '2-digit', minute: '2-digit' });
ok(sf === '06:46 PM' || sf === '06:47 PM', 'SF sunset 2026-10-07 ≈ 18:46 PDT', sf);
ok(Math.abs(sun.azimuth - 263.5) < 1.5, 'SF sunset azimuth ≈ 263°', sun.azimuth.toFixed(1));
ok(sunsetInfo('2026-10-07', 37.93, -122.58, 760).elevationGainMin >= 3, 'elevated spot sees a later sunset');

// ---------- regional HRRR fog weight ----------
{
  const hrrrFog = mk(obs(0, 0.25, 0.45), clearPath).map((m) => (m.id === 'ncep_hrrr_conus' ? { ...m, path: [{ ...m.path[0], low: 0.9 }, ...m.path.slice(1)] } : m));
  const sdRegion = REGION_BY_ID.sd, socalRegion = { ...REGION_BY_ID.socal, fog: REGION_BY_ID.sd.fog };
  const at = (reg, day) => forecast({ spot, sun, day, members: hrrrFog, aq: { aod: 0.06 }, profile: null, region: reg, month: 9, pathAvailable: true }).fogRisk;
  ok(REGION_BY_ID.sd.hrrrFogWeight === 0.35 && REGIONS.filter((r) => r.hrrrFogWeight != null).length === 1, 'only San Diego lowers HRRR’s fog weight (to 0.35)');
  ok(at(sdRegion, 0) < at(socalRegion, 0), 'when only HRRR sees fog, San Diego’s day-0 fog risk is lower than elsewhere', `${at(sdRegion, 0).toFixed(2)} vs ${at(socalRegion, 0).toFixed(2)}`);
  ok(Math.abs(at(sdRegion, 1) - at(socalRegion, 1)) < 1e-9, 'tomorrow’s fog weighting is unchanged everywhere');
}

// ---------- broken-model detection ----------
// Synthetic dataset: 40 locations × 24 hours; `cloudy` maps model id → share of samples with mid/high cloud.
function fakeData(cloudy) {
  const loc = (k) => ({ t: Array.from({ length: 24 }, (_, h) => h * 3600), s: Object.fromEntries(MODELS.map((M) => {
    const share = cloudy[M.id] ?? 0;
    const series = Array.from({ length: 24 }, (_, h) => ((h * 7 + k * 3) % 100) / 100 < share ? 40 : 0);
    return [M.id, { cloud_cover_low: series.map(() => 0), cloud_cover_mid: series.map(() => 0), cloud_cover_high: series }];
  })) });
  return { obs: Array.from({ length: 40 }, (_, k) => loc(k)), path: [] };
}
const [H, E, G, I] = MODELS.map((M) => M.id);
ok(!MODELS.some((M) => M.id === 'gem_seamless') && MODELS.length === 4, 'GEM is no longer an ensemble member', MODELS.map((M) => M.name).join(', '));
ok(Math.abs(MODELS.reduce((s, M) => s + M.w[0], 0) - 1) < 1e-9 && Math.abs(MODELS.reduce((s, M) => s + M.w[1], 0) - 1) < 1e-9, 'model weights sum to 1 for today and tomorrow');
let broken = detectBrokenModels(fakeData({ [H]: 0.4, [E]: 0.5, [G]: 0.45, [I]: 0 }));
ok(broken.length === 1 && broken[0].name === 'ICON', 'a model with zero mid/high cloud everywhere while the others show cloud is flagged', broken.map((b) => b.name).join(','));
ok(detectBrokenModels(fakeData({})).length === 0, 'statewide clear sky (all models zero) flags nothing');
ok(detectBrokenModels(fakeData({ [H]: 0.4 })).length === 0, 'one cloudy model vs three clear ones flags nothing (no majority)');
const tiny = fakeData({ [H]: 0.4, [E]: 0.5, [G]: 0.45, [I]: 0 }); tiny.obs = tiny.obs.slice(0, 1);
ok(detectBrokenModels(tiny).length === 0, 'too few samples → no verdict');
// Excluded models are left out of the inputs and reported in the forecast.
const bad = fakeData({ [H]: 0.4, [E]: 0.5, [G]: 0.45, [I]: 0 }); bad.pathIndex = { t: [] }; bad.pathKeys = [];
const ex = detectBrokenModels(bad);
const inp = buildInputs(bad, 0, { id: 't' }, 12 * 3600 * 1000, 0, ex);
ok(inp.members.length === 3 && !inp.members.some((m) => m.id === I), 'buildInputs drops the excluded model');
const fx = forecast({ spot, sun, day: 0, members: mk(obs(0, 0.25, 0.45), clearPath).filter((m) => m.id !== I), aq: { aod: 0.06 }, profile: null, region, month: 9, pathAvailable: true, excluded: ex });
ok(fx.warnings.some((w) => w.id === 'warn.excluded') && fx.members.find((m) => m.id === I).excluded, 'the forecast warns about and marks the excluded model');

// ---------- translations ----------
const zhKeys = Object.keys(STRINGS.zh), enKeys = Object.keys(STRINGS.en);
const onlyZh = zhKeys.filter((k) => !(k in STRINGS.en)), onlyEn = enKeys.filter((k) => !(k in STRINGS.zh));
ok(!onlyZh.length && !onlyEn.length, `zh and en define the same ${zhKeys.length} keys`, [...onlyZh.map((k) => 'missing en: ' + k), ...onlyEn.map((k) => 'missing zh: ' + k)].join(', '));
const typeMismatch = zhKeys.filter((k) => k in STRINGS.en && typeof STRINGS.zh[k] !== typeof STRINGS.en[k]);
ok(!typeMismatch.length, 'each key has the same kind (text / template function) in both languages', typeMismatch.join(', '));
// One language may omit a value the other uses (e.g. English drops the Chinese direction name), but
// neither may use a placeholder outside the other's set — that would mean a value nobody passes.
const ph = (str) => new Set(str.match(/\{\w+\}/g) || []);
const sub = (a, b) => [...a].every((x) => b.has(x));
const phMismatch = zhKeys.filter((k) => typeof STRINGS.zh[k] === 'string' && typeof STRINGS.en[k] === 'string'
  && !sub(ph(STRINGS.zh[k]), ph(STRINGS.en[k])) && !sub(ph(STRINGS.en[k]), ph(STRINGS.zh[k])));
ok(!phMismatch.length, 'placeholders are consistent between languages', phMismatch.join(', '));
ok(REGIONS.every((r) => STRINGS.zh[`note.${r.id}`] && STRINGS.en[`note.${r.id}`]), 'every region has a climate note in both languages');

// Every key the model can emit, across a spread of scenarios, renders cleanly in both languages.
const scenarios = [good, split, tomorrow, none, low, high, noFogHill, fx,
  forecast({ spot, sun, day: 1, members: mk(obs(0.5, 0.9, 0.9, { vis: 3000, t2: 15, t925: 28, rh: 97 }), foggyPath).slice(1), aq: { aod: 0.5, pm25: 60 }, profile: null, region, month: 9, pathAvailable: false }),
  forecast({ spot: { ...spot, view: [0, 90] }, sun, day: 0, members: mk(obs(0.4, 0.1, 0.15), [cell(0.5, 0, 0.1), cell(0.7, 0, 0), cell(0.6, 0, 0), cell(0.5, 0, 0)]), aq: { aod: 0.2 }, profile: null, region, month: 9, pathAvailable: true }),
];
const emitted = [];
for (const o of scenarios) {
  emitted.push(['', o.headline], ['', o.label], ['', o.timing.peakKey]);
  for (const r of o.reasons) emitted.push([r.vars, r.id]);
  for (const w of o.warnings) emitted.push([w.vars, w.id]);
  if (o.confidence) emitted.push(['', `conf.${o.confidence.level}`]);
}
const badRender = [];
for (const l of ['zh', 'en']) {
  setLang(l);
  for (const [vars, key] of emitted) {
    const text = tr(key, vars || {});
    if (!(key in STRINGS[l]) || /\{\w+\}|undefined|NaN|null/.test(text)) badRender.push(`${l}:${key} → ${text}`);
  }
}
setLang('zh');
ok(!badRender.length, `all ${new Set(emitted.map((e) => e[1])).size} model text keys render in both languages`, badRender.slice(0, 5).join(' | '));

// Keys referenced by the page markup and by app.js exist.
const html = await (await fetch('index.html')).text();
const htmlKeys = [...html.matchAll(/data-i18n="([\w.]+)"/g)].map((m) => m[1])
  .concat([...html.matchAll(/data-i18n-attr="([^"]+)"/g)].flatMap((m) => m[1].split(';').map((p) => p.split(':')[1])));
const appJs = await (await fetch('app.js')).text();
// Any quoted 'prefix.name' literal whose prefix is a translation namespace (catches tr(cond ? 'a.b' : 'a.c')).
const prefixes = new Set(zhKeys.map((k) => k.split('.')[0]));
const appKeys = [...appJs.matchAll(/'([a-zA-Z]+\.[\w.]+)'/g)].map((m) => m[1]).filter((k) => prefixes.has(k.split('.')[0]));
const missingRefs = [...new Set([...htmlKeys, ...appKeys])].filter((k) => !(k in STRINGS.zh) || !(k in STRINGS.en));
ok(!missingRefs.length, `all ${new Set([...htmlKeys, ...appKeys]).size} keys used in index.html and app.js exist`, missingRefs.join(', '));
const unused = zhKeys.filter((k) => !htmlKeys.includes(k) && !appKeys.includes(k) && !emitted.some((e) => e[1] === k)
  && !/^(note|legend|day|conf|label|layer|reason|src|warn|r|hl|peak)\./.test(k) && k !== 'title' && k !== 'meta.desc');
ok(!unused.length, 'no unused translation keys', unused.join(', '));

out.push('', fails ? `<span class="bad">${fails} failed</span>` : '<span class="ok">all passed</span>');
document.getElementById('out').innerHTML = out.join('\n');
document.title = fails ? `FAIL ${fails}` : 'PASS';
</script>
</body>
</html>
